# Default profile. Switch with --spring.profiles.active=dev|remote|192|test|prod
# Profiles:
#   dev    : 本地 127.0.0.1 数据库 (免密模式，G:\pgsql)
#   remote : 远程 192.9.51.198 数据库
#   192    : 远程 192.9.51.198 数据库 (同 remote)
#   test   : 测试环境 (默认指向 192.9.51.198)
#   prod   : 生产环境
spring.application.name=spring-ai-agent-platform
spring.profiles.default=dev
spring.config.import=optional:classpath:application-local.properties

server.port=8080
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai
spring.web.resources.static-locations=classpath:/static/

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration


spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7

# Used only to encrypt LLM keys stored in the database. Not an LLM key. Override in prod.
app.crypto.secret=${APP_CRYPTO_SECRET:local-dev-crypto-key-change-me}
app.seed.demo-users=false
app.ai.simulation-fallback=false
app.security.allow-private-provider-urls=false
app.bocha.api-key=${BOCHA_API_KEY:}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m

# File Upload Limits (supports up to 15MB per file, up to 5 files per batch)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

# Dify Knowledge Base (RAG) external integration
app.dify.base-url=${DIFY_BASE_URL:}
app.dify.api-key=${DIFY_API_KEY:}

# Local Object Storage for Knowledge Base Files
app.storage.local.root-dir=${APP_STORAGE_ROOT:./data/kb-files}

# ===================================================================
# RAG 可插拔 OCR 引擎配置 (支持 1. 本地部署 LOCAL_PADDLE_OCR / 2. 在线云端 API ONLINE_API)
# ===================================================================
app.rag.ocr.enabled=${APP_RAG_OCR_ENABLED:false}
# 模式选择: LOCAL_PADDLE_OCR (本地部署) 或 ONLINE_API (在线云端 API)
app.rag.ocr.provider=${APP_RAG_OCR_PROVIDER:LOCAL_PADDLE_OCR}

# 选项 1: 本地部署 (PaddleOCR / PP-Structure 服务，100% 数据不出局域网)
app.rag.ocr.endpoint=${APP_RAG_OCR_LOCAL_ENDPOINT:http://localhost:8866/predict/ocr_system}
app.rag.ocr.timeout-seconds=${APP_RAG_OCR_LOCAL_TIMEOUT:30}

# 选项 2: 在线云端 API (支持通义千问 Qwen-VL / OpenAI 等兼容 Vision 多模态模型接口)
app.rag.ocr.online.endpoint=${APP_RAG_OCR_ONLINE_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
app.rag.ocr.online.api-key=${APP_RAG_OCR_ONLINE_KEY:}
app.rag.ocr.online.model=${APP_RAG_OCR_ONLINE_MODEL:qwen-vl-plus}
app.rag.ocr.online.timeout-seconds=${APP_RAG_OCR_ONLINE_TIMEOUT:60}


