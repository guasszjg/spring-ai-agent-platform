# Local development (default). Local DB may stay here; never put a real LLM key in this file.
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/guass_test
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
app.seed.demo-users=true
app.ai.simulation-fallback=true
app.security.allow-private-provider-urls=true

spring.ai.openai.api-key=${OPENAI_API_KEY:demo-key}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}

# Local Dify RAG. Configurable via UI 'AI Engines & Model Gateway' or env vars.
app.dify.base-url=${DIFY_BASE_URL:}
app.dify.api-key=${DIFY_API_KEY:}

logging.level.root=INFO
logging.level.org.springframework.ai=INFO
logging.level.com.example.agentplatform=DEBUG
