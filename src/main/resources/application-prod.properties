# Production. DB and LLM key must come from the environment. Do not put secrets in this file.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
app.crypto.secret=${APP_CRYPTO_SECRET}
app.seed.demo-users=false
app.ai.simulation-fallback=false
app.security.allow-private-provider-urls=false
server.servlet.session.cookie.secure=true

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}

logging.level.root=WARN
logging.level.org.springframework.ai=WARN
logging.level.com.example.agentplatform=INFO
